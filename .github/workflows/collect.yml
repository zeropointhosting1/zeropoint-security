# Collects every threat feed and upserts the result into Supabase (public.snapshots), which the
# Cloudflare Worker serves as /api/threats and /api/alerts.
# Needs the repo secret SUPABASE_DB_URL: the zeropoint_collector role from supabase/setup.sql
# (session pooler connection string). Never the service_role key.
name: Collect threat feeds

on:
  # Disabled until the SUPABASE_DB_URL secret exists; uncomment to run every 5 minutes.
  # schedule:
  #   - cron: "*/5 * * * *" # GitHub's minimum; runs can start a few minutes late under load
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The DB-IP database is ~60 MB to download; reuse it across runs for the month.
      - id: month
        run: echo "stamp=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/dbip-city-lite.mmdb
          key: dbip-${{ steps.month.outputs.stamp }}

      - run: npx tsx scripts/collect.ts --upload
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Optional: token with only "Account · Radar · Read", for DDoS attack lines.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
